<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>منظومة المتابعة الأكاديمية – مدرسة الأمان الدولية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#F5F9FC; --surface:#FFFFFF; --surface2:#EDF3F9; --text:#202638; --muted:#66708A; --border:#DCE7F0;
  --brand:#0F0E9F; --brand2:#2732B3; --on-brand:#FFFFFF;
  --v-ex:#0F0E9F; --v-vg:#2E9E3D; --v-g:#1F8FC9; --v-ok:#A77D18; --v-low:#A33B3B;
  --s1:#A33B3B; --s2:#A77D18; --s3:#1F8FC9; --s4:#2E9E3D; --on-s:#FFFFFF;
  --shadow:0 1px 2px rgba(15,14,159,.06),0 8px 22px rgba(15,14,159,.07);
  --ring-track:#E3ECF4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1120; --surface:#141B2E; --surface2:#1C2540; --text:#E7EBF5; --muted:#9AA4BD; --border:#27324F;
    --brand:#A3AAFF; --brand2:#8791FF; --on-brand:#0C1120;
    --v-ex:#98A0FF; --v-vg:#4CC35B; --v-g:#43B3EC; --v-ok:#D9A93C; --v-low:#EE7B7B;
    --s1:#EE7B7B; --s2:#D9A93C; --s3:#43B3EC; --s4:#4CC35B; --on-s:#0B1020;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    --ring-track:#25304D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1120; --surface:#141B2E; --surface2:#1C2540; --text:#E7EBF5; --muted:#9AA4BD; --border:#27324F;
  --brand:#A3AAFF; --brand2:#8791FF; --on-brand:#0C1120;
  --v-ex:#98A0FF; --v-vg:#4CC35B; --v-g:#43B3EC; --v-ok:#D9A93C; --v-low:#EE7B7B;
  --s1:#EE7B7B; --s2:#D9A93C; --s3:#43B3EC; --s4:#4CC35B; --on-s:#0B1020;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  --ring-track:#25304D;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);background:var(--bg)}
body{font-family:'Tajawal','Cairo',sans-serif;font-weight:500;background:var(--bg);color:var(--text);line-height:1.7;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px;border-radius:8px}
.app{max-width:760px;margin:0 auto;padding:0 14px 130px}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 12px}
.head-id{display:flex;align-items:center;gap:12px;min-width:0}
.logo-plate{background:#fff;border-radius:12px;padding:6px 10px;border:1px solid var(--border);flex:0 0 auto}
.logo-plate img{display:block;height:38px;width:auto}
.head h1{font:800 19px/1.3 'Cairo',sans-serif;color:var(--brand)}
.head p{font-size:12.5px;color:var(--muted)}
.demo-chip{flex:0 0 auto;font:700 11.5px 'Cairo',sans-serif;border:1px dashed var(--v-ok);color:var(--v-ok);border-radius:999px;padding:3px 10px}

/* live strip */
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:10px 14px 12px;margin-bottom:12px}
.strip-top{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:62px;height:62px;flex:0 0 62px}
.ring svg{width:62px;height:62px;transform:rotate(-90deg);direction:ltr}
.ring .track{fill:none;stroke:var(--ring-track);stroke-width:7}
.ring .arc{fill:none;stroke:var(--border);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s ease,stroke .3s}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font:900 20px 'Cairo',sans-serif}
.sv{flex:1;min-width:0}
.vl{font:800 18px/1.25 'Cairo',sans-serif}
.vd{font-size:12.5px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cnt{text-align:center;flex:0 0 auto;font:800 17px 'Cairo',sans-serif;line-height:1.2}
.cnt small{display:block;font:500 11px 'Tajawal',sans-serif;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.seg{height:6px;border-radius:4px;background:var(--ring-track);overflow:hidden}
.seg i{display:block;height:100%;width:0;border-radius:4px;transition:width .4s,background .3s}
@media (prefers-reduced-motion:reduce){.ring .arc,.seg i{transition:none}}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 13px;font:600 13px 'Tajawal',sans-serif;color:var(--muted);white-space:nowrap}
.tab small{margin-inline-start:6px;font-size:11.5px;opacity:.85}
.tab.done{color:var(--text)}
.tab.done small{color:var(--v-vg);opacity:1}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tab.on small{color:inherit}

/* sections */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-h h2{font:800 17px/1.35 'Cairo',sans-serif;color:var(--brand)}
.panel-h .sub{font-size:12.5px;color:var(--muted)}
.dscore{font:900 20px 'Cairo',sans-serif;text-align:left;flex:0 0 auto}
.dscore small{display:block;font:500 11px 'Tajawal',sans-serif;color:var(--muted)}
.legend{border-bottom:1px solid var(--border);padding:0 16px}
.legend summary{padding:9px 0;font-size:13px;color:var(--brand);font-weight:700;cursor:pointer}
.legend ul{list-style:none;padding:0 0 10px;display:grid;gap:4px;font-size:13px}
.legend li b{display:inline-block;min-width:18px;font-family:'Cairo',sans-serif}

.item{padding:14px 16px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.num{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface2);color:var(--muted);font:800 12.5px/26px 'Cairo',sans-serif;text-align:center}
.item .t{font-weight:700;font-size:15px;line-height:1.55}
.item .h{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:1px}
.new{font:700 10.5px 'Cairo',sans-serif;background:var(--surface2);color:var(--brand);border-radius:6px;padding:1px 7px;margin-inline-start:6px;vertical-align:middle}
.scale{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px}
.scale button{border:1.5px solid var(--border);background:var(--surface2);border-radius:12px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;transition:background .15s,border-color .15s,transform .1s}
.scale button b{font:800 18px 'Cairo',sans-serif}
.scale button span{font-size:11.5px;color:var(--muted)}
.scale button:active{transform:scale(.97)}
.scale .sc1.on{background:var(--s1);border-color:var(--s1)}
.scale .sc2.on{background:var(--s2);border-color:var(--s2)}
.scale .sc3.on{background:var(--s3);border-color:var(--s3)}
.scale .sc4.on{background:var(--s4);border-color:var(--s4)}
.scale .on b,.scale .on span{color:var(--on-s)}
.scale .na{min-width:66px;padding:0 6px;background:transparent;border-style:dashed}
.scale .na span{font-size:12px}
.scale .na.on{background:var(--muted);border-style:solid;border-color:var(--muted)}
.scale .na.on span{color:var(--bg)}
.item.is-na .t,.item.is-na .h{opacity:.55}

/* info form */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.fields .full{grid-column:1 / -1}
.fld label.chk{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);margin:0;cursor:pointer}
.fld label.chk input{width:20px;height:20px;accent-color:var(--brand)}
.fld label{display:block;font-size:13px;font-weight:700;margin-bottom:4px;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:46px;outline:none}
.inp:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(39,50,179,.15)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.7}
.note{margin:0 16px 16px;padding:11px 13px;background:var(--surface2);border-radius:12px;font-size:13px;color:var(--muted);line-height:1.7}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}
.btn{border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;min-height:46px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:default}

/* phrases */
.grp{border-bottom:1px solid var(--border)}
.grp:last-child{border-bottom:0}
.grp summary{padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.grp summary .badge{font:700 11px 'Cairo',sans-serif;color:var(--brand);background:var(--surface2);border-radius:999px;padding:1px 9px}
.chips{display:grid;gap:7px;padding:0 16px 14px}
.chip{display:block;width:100%;text-align:right;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.65}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--surface2)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--v-vg);font-weight:800}
.chip .sug{font:700 10.5px 'Cairo',sans-serif;color:var(--v-ok);border:1px solid var(--v-ok);border-radius:6px;padding:0 6px;margin-inline-start:6px}
.chips.inline{display:flex;flex-wrap:wrap}
.chips.inline .chip{width:auto}
.sec-t{padding:14px 16px 6px;font:800 15px 'Cairo',sans-serif;color:var(--brand)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--border)}
.switch{width:50px;height:30px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface2);position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--v-ok);border-color:var(--v-ok)}
.switch[aria-checked="true"]::after{inset-inline-start:23px;background:#fff}

/* report preview */
.pv-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pv-help{font-size:13px;color:var(--muted);margin-bottom:12px}
.pv-wrap{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
.pv-inner{position:absolute;top:0;right:0;transform-origin:top right}

/* toolbar + history */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.toolbar .btn{min-height:42px;padding:8px 14px;font-size:14px}
.bd{display:inline-block;min-width:22px;padding:0 6px;border-radius:999px;background:var(--surface2);color:var(--brand);font:800 12px/20px 'Cairo',sans-serif;text-align:center;margin-inline-start:7px}
body.hist-mode .strip,body.hist-mode .tabs,body.hist-mode .nav{display:none}
body.hist-mode .app{padding-bottom:40px}
.banner{margin-bottom:12px;padding:10px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-size:13.5px;font-weight:700;color:var(--v-ok)}
.pv-warn{margin-bottom:12px;padding:9px 12px;border-radius:12px;background:var(--surface2);color:var(--v-low);font-size:13.5px;font-weight:700}
.pv-warn[hidden]{display:none}
.seg-f{display:flex;gap:6px;padding:12px 16px;flex-wrap:wrap}
.fbtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 13px;font-weight:700;font-size:13px;color:var(--muted)}
.fbtn.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.rec{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-top:1px solid var(--border);align-items:center}
.rec-t{font:800 15px/1.5 'Cairo',sans-serif}
.rec-s{font-size:12.5px;color:var(--muted);line-height:1.7}
.rec-s span{display:inline-block;margin-inline-end:14px}
.rec-score{text-align:center;font:900 24px/1.1 'Cairo',sans-serif;min-width:64px}
.rec-score small{display:block;font:700 11px 'Tajawal',sans-serif}
.rec-btns{grid-column:1 / -1;display:flex;gap:8px}
.btn.sm{min-height:40px;padding:6px 16px;font-size:14px}
.pill{font:700 11px 'Cairo',sans-serif;border-radius:999px;padding:1px 9px;margin-inline-start:8px;border:1px solid var(--v-ok);color:var(--v-ok);vertical-align:middle}
.pill.done{border-color:var(--v-vg);color:var(--v-vg)}

/* bottom nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(15,14,159,.08)}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nav .mid{text-align:center;font-size:12.5px;color:var(--muted);line-height:1.3}
.nav .mid b{display:block;font:800 14px 'Cairo',sans-serif;color:var(--text)}
.nav .btn{min-height:48px}
.toast{position:fixed;inset-inline:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:420px;background:var(--text);color:var(--bg);border-radius:12px;padding:11px 14px;font-size:14px;z-index:60;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* report sheet: fixed print colours (never themed) */
#printHost{display:none}
.sheet{width:794px;min-height:1123px;background:#fff;color:#202638;padding:34px 40px 30px;direction:rtl;font-family:'Tajawal','Cairo',sans-serif;font-size:13px;line-height:1.7;letter-spacing:0}
.sheet *{letter-spacing:0}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:3px solid #0F0E9F;position:relative}
.sh-head::after{content:"";position:absolute;bottom:-3px;right:0;width:96px;height:3px;background:#3BB14A}
.sh-head img{height:52px;width:auto;display:block}
.sh-title{text-align:left}
.sh-title h1{font:800 22px/1.3 'Cairo',sans-serif;color:#0F0E9F}
.sh-title p{font-size:12px;color:#66708A}
.sh-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:16px;border:1px solid #DCE7F0;border-radius:10px;overflow:hidden}
.sh-meta div{padding:7px 10px;border-inline-start:1px solid #DCE7F0;border-bottom:1px solid #DCE7F0}
.sh-meta div:nth-child(4n+1){border-inline-start:0}
.sh-meta span{display:block;font-size:11px;color:#66708A}
.sh-meta b{font-weight:700;font-size:13px}
.sh-meta .w2{grid-column:span 2}
.sh-meta .w4{grid-column:span 4}
.sh-score{display:flex;align-items:center;gap:22px;margin-top:18px;padding:16px 20px;background:#F5F9FC;border-radius:14px}
.sh-ring{position:relative;width:112px;height:112px;flex:0 0 112px}
.sh-ring svg{width:112px;height:112px;transform:rotate(-90deg);direction:ltr}
.sh-ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:900 34px/1 'Cairo',sans-serif}
.sh-ring .rv small{font:500 11px 'Tajawal',sans-serif;color:#66708A;margin-top:3px}
.sh-verdict h2{font:900 26px/1.2 'Cairo',sans-serif}
.sh-verdict p{font-size:13px;color:#4a536b;margin-top:3px}
.sh-verdict .meta{font-size:12px;color:#66708A;margin-top:6px}
.sh-verdict .tag{display:inline-block;font:700 11px 'Cairo',sans-serif;border:1px solid #A77D18;color:#A77D18;border-radius:6px;padding:0 8px;margin-inline-start:6px}
.sh-sec{margin-top:18px}
.sh-sec h3{font:800 14.5px 'Cairo',sans-serif;color:#0F0E9F;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.sh-sec h3::before{content:"";width:5px;height:15px;border-radius:3px;background:#27A1DB}
.sh-dom{display:grid;grid-template-columns:200px 1fr 52px;gap:10px;align-items:center;margin-bottom:6px}
.sh-dom .nm{font-weight:700;font-size:12.5px;line-height:1.4}
.sh-bar{height:11px;background:#E3ECF4;border-radius:6px;overflow:hidden}
.sh-bar i{display:block;height:100%;border-radius:6px}
.sh-dom .pc{font:800 13px 'Cairo',sans-serif;text-align:left}
.sh-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sh-list{list-style:none;padding:0;display:grid;gap:4px}
.sh-list li{position:relative;padding-inline-start:14px;font-size:12.5px;line-height:1.65}
.sh-list li::before{content:"";position:absolute;top:9px;inset-inline-start:0;width:6px;height:6px;border-radius:50%;background:#27A1DB}
.sh-list.good li::before{background:#2E9E3D}
.sh-list.warn li::before{background:#A77D18}
.sh-list .sc{font:800 11px 'Cairo',sans-serif;color:#66708A;margin-inline-start:4px}
.sh-empty{font-size:12.5px;color:#8b94aa}
.sh-note{white-space:pre-wrap;font-size:12.5px;line-height:1.75;border:1px solid #DCE7F0;border-radius:10px;padding:9px 12px;background:#fff}
.sh-flag{margin-top:12px;padding:8px 12px;border-radius:10px;background:#FBF3DC;color:#7a5a0e;font-weight:700;font-size:12.5px}
.sh-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:26px}
.sh-sign div{border-top:1.5px solid #9aa4bd;padding-top:5px;font-size:12px;color:#66708A;text-align:center}
.sh-foot{margin-top:16px;font-size:10.5px;color:#8b94aa;text-align:center}

@media (max-width:520px){
  .fields{grid-template-columns:1fr}
  .head h1{font-size:17px}
  .logo-plate img{height:32px}
  .vl{font-size:16px}
}
@media print{
  @page{size:A4;margin:0}
  body.printing .app,body.printing .nav,body.printing .toast{display:none!important}
  body.printing #printHost{display:block}
  html,body{background:#fff!important}
}

[hidden]{display:none!important}


/* ───── البوابة ───── */
.who{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.who .nm{font:800 13.5px 'Cairo',sans-serif;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .rl{font-size:11.5px;color:var(--muted);line-height:1.3}
.btn.xs{min-height:34px;padding:4px 12px;font-size:13px}
.loading{padding:60px 16px;text-align:center;color:var(--muted);font-weight:700}
.login{max-width:420px;margin:30px auto 0}
.login .inp{direction:ltr;text-align:center;letter-spacing:2px;font:700 18px 'Cairo',sans-serif;text-transform:uppercase}
.login .err{margin:0 16px 12px;padding:9px 12px;border-radius:12px;background:var(--surface2);color:var(--v-low);font-size:13.5px;font-weight:700}
.savestat{font-size:12.5px;color:var(--muted);align-self:center;margin-inline-start:4px}
.savestat.bad{color:var(--v-low);font-weight:700}
.toolbar{align-items:center}
.ptabs{margin-bottom:6px}
.empty{padding:34px 18px;text-align:center;color:var(--muted);line-height:1.9}
.empty b{display:block;font:800 16px 'Cairo',sans-serif;color:var(--text);margin-bottom:4px}

/* لوحة الإدارة */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .v{font:900 28px/1.1 'Cairo',sans-serif;color:var(--brand)}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .s{font-size:12px;font-weight:700;margin-top:2px}
.sect{margin-bottom:12px}
.sect .panel-h h2{font-size:15.5px}
.pad{padding:12px 16px 16px}
.dist{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--ring-track);margin:4px 0 10px}
.dist i{display:block;height:100%}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.legend2 span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted));margin-inline-end:6px;vertical-align:middle}
.hb{display:grid;grid-template-columns:1fr;gap:3px;margin-bottom:10px}
.hb .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.hb .t b{font-family:'Cairo',sans-serif}
.hb .b{height:10px;border-radius:6px;background:var(--ring-track);overflow:hidden}
.hb .b i{display:block;height:100%;border-radius:6px}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{background:var(--surface2);color:var(--muted);font-weight:700;padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface2)}
.tbl .tn{font-family:'Cairo',sans-serif;font-weight:800}
.chipv{display:inline-block;font:700 11.5px 'Cairo',sans-serif;border-radius:999px;padding:1px 9px;border:1px solid var(--c,var(--muted));color:var(--c,var(--muted))}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.filters select{min-height:40px;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:6px 10px}
.fu{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--border);cursor:pointer}
.fu:hover{background:var(--surface2)}
.rep-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
</style>
</head>

/* ───────── أدوات ───────── */
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},3800);}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
function todayISO(){var d=new Date();var m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+dd;}
function fmtDate(iso){if(!iso)return '—';var p=String(iso).slice(0,10).split('-');return p.length===3?(+p[2])+'/'+(+p[1])+'/'+p[0]:iso;}
function fmtDT(iso){if(!iso)return '—';var d=new Date(iso);if(isNaN(d))return '—';var p=function(n){return ('0'+n).slice(-2);};return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());}
function schoolYear(iso){var y=+(iso||todayISO()).slice(0,4),m=+(iso||todayISO()).slice(5,7);return m>=8?y+'/'+(y+1):(y-1)+'/'+y;}
function uniq(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x);});return o;}

var CODE='',ME=null,SETTINGS={},ROSTER=null,TNAME={},CSELF='';
function api(action,extra){
  var body=Object.assign({action:action,code:CODE},extra||{});
  var ctl=('AbortController' in window)?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort();},35000);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',signal:ctl?ctl.signal:undefined})
    .then(function(r){return r.json();})
    .then(function(j){clearTimeout(to);if(!j.ok){var e=new Error(j.error||'server');e.code=j.error||'server';e.detail=j.detail;throw e;}return j;})
    .catch(function(e){clearTimeout(to);if(!e.code)e.code='network';throw e;});
}

function boot(){
  var k=null;
  try{var u=new URL(location.href);k=u.searchParams.get('k');if(k){u.searchParams.delete('k');history.replaceState(null,'',u.pathname+(u.search||'')+u.hash);}}catch(e){}
  if(k)lsSet(LS_CODE,k);
  CODE=lsGet(LS_CODE)||'';
  if(!CODE){showLogin();return;}
  loadMe();
}
function loadMe(){
  $('#view').innerHTML='<div class="loading">جارٍ التحميل…</div>';
  api('whoami').then(function(r){ME=r.person;SETTINGS=r.settings||{};start();}).catch(function(e){
    if(e.code==='unauthorized'){lsDel(LS_CODE);CODE='';showLogin('الرمز غير صالح أو أُلغي. اطلب رابطاً جديداً من الإدارة.');}
    else{$('#view').innerHTML='<div class="panel"><div class="empty"><b>تعذّر التحميل</b>'+esc(errText(e))+'<div style="margin-top:12px"><button class="btn primary" id="retryBtn" type="button">إعادة المحاولة</button></div></div></div>';}
  });
}
function logout(){
  flushNow();lsDel(LS_CODE);if(ME)lsDel('aman-bk-'+ME.name);CODE='';ME=null;ROSTER=null;state=freshState();showLogin();
}

var ROLE_AR={teacher:'معلم(ة)',coordinator:'منسق(ة)',admin:'إدارة'};
var CUR='';
function tabsFor(){
  var t=[];
  if(has('coordinator')){t.push(['obs','مشاهدة صفية']);t.push(['hist','سجل مشاهداتي']);}
  if(has('admin'))t.push(['dash','لوحة المتابعة']);
  if(has('teacher'))t.push(['my','تقاريري']);
  return t;
}
function start(){
  var rl=ME.roles.map(function(r){return ROLE_AR[r];}).join(' و');
  $('#who').hidden=false;
  $('#who').innerHTML='<div><div class="nm">'+esc(ME.name)+'</div><div class="rl">'+esc(rl)+'</div></div><button class="btn xs ghost" id="logoutBtn" type="button">خروج</button>';
  var t=tabsFor();
  $('#ptabs').hidden=t.length<2;
  $('#ptabs').innerHTML=t.map(function(x){return '<button type="button" class="tab" data-pt="'+x[0]+'">'+esc(x[1])+'</button>';}).join('');
  var first=has('coordinator')?'obs':(has('admin')?'dash':'my');
  go(first);
}
function go(v){
  if(CUR==='obs'&&v!=='obs')flushNow();
  CUR=v;
  $$('#ptabs .tab').forEach(function(b){var on=b.dataset.pt===v;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  $('#bnav').style.display=v==='obs'?'block':'none';
  window.scrollTo(0,0);
  if(v==='obs')showObs();else if(v==='hist')showHist();else if(v==='dash')showDash();else showMy();
}

/* ───────── القوائم للمنسق ───────── */
function ensureRoster(){
  if(ROSTER)return Promise.resolve();
  return api('getRoster').then(function(r){
    ROSTER=r.roster;TNAME={};ROSTER.teachers.forEach(function(t){TNAME[t.id]=t.name;});
    CSELF=ME.tid||'';
  });
}
function teachersFor(all){
  var cid=ME.cid;
  var ids=uniq(ROSTER.assign.filter(function(r){return all||r[3]===cid;}).map(function(r){return r[0];}));
  if(CSELF)ids=ids.filter(function(x){return x!==CSELF;});
  return ids.map(function(id){return {v:id,l:TNAME[id]||id};}).sort(function(a,b){return a.l.localeCompare(b.l,'ar');});
}
function subjectsFor(tid,all){return uniq(ROSTER.assign.filter(function(r){return r[0]===tid&&(all||r[3]===ME.cid);}).map(function(r){return r[2];}));}
function sectionsFor(tid,subj){
  var codes=uniq(ROSTER.assign.filter(function(r){return r[0]===tid&&(!subj||r[2]===subj);}).map(function(r){return r[1];}));
  return ROSTER.sections.filter(function(c){return codes.indexOf(c)>-1;});
}

/* ───────── حالة المشاهدة ───────── */
function freshState(){return {id:null,status:'draft',step:0,exportedAt:'',saved:null,info:{teacherId:'',teacher:'',subject:'',grade:'',date:todayISO(),period:'',topic:'',showAll:false},scores:{},pS:[],pD:[],pR:[],notes:'',follow:false};}
var state=freshState();
function hasData(){var i=state.info;return !!(i.teacherId||i.subject||i.topic||Object.keys(state.scores).length||state.notes.trim()||state.pS.length||state.pD.length||state.pR.length);}
function calcScores(sc){
  var sum=0,n=0,dom={};
  DOMAINS.forEach(function(d){var s=0,c=0,na=0;
    d.items.forEach(function(it){var v=sc[it.id];if(typeof v==='number'){s+=v;c++;}else if(v==='na')na++;});
    dom[d.id]={sum:s,answered:c,na:na,total:d.items.length,handled:c+na,pct:c?Math.round(s/(c*4)*100):null};sum+=s;n+=c;});
  return {sum:sum,n:n,pct:n?Math.round(sum/(n*4)*100):null,dom:dom};
}
function calc(){return calcScores(state.scores);}
function texts(list,ids){return list.filter(function(p){return ids.indexOf(p.id)>-1;}).map(function(p){return p.t;});}
function payload(){
  var i=state.info;
  return {info:{teacherId:i.teacherId,subject:i.subject,grade:i.grade,date:i.date,period:i.period,topic:i.topic,showAll:!!i.showAll},
    scores:state.scores,pS:state.pS,pD:state.pD,pR:state.pR,step:state.step,
    report:{strengths:texts(S,state.pS),dev:texts(DV,state.pD),recs:RECS.filter(function(t,k){return state.pR.indexOf('r'+k)>-1;}),notes:state.notes,follow:state.follow}};
}
function stateFromServer(o){
  var s=o.summary,d=o.data||{},st=freshState();
  st.id=s.id;st.status=s.status;st.exportedAt=s.exported;
  st.info={teacherId:s.teacherId,teacher:s.teacher,subject:s.subject,grade:s.section,date:s.date,period:s.period,topic:s.topic,showAll:!!d.showAll};
  st.scores=d.scores||{};st.pS=d.pS||[];st.pD=d.pD||[];st.pR=d.pR||[];st.notes=d.notes||'';st.follow=!!d.follow;
  st.saved={strengths:d.strengths||[],dev:d.dev||[],recs:d.recs||[]};
  st.step=s.status==='exported'?STEPS.length-1:(d.step||0);
  return st;
}

/* ───────── المزامنة مع الخادم ───────── */
var dirty=false,saving=false,saveTimer=null,ver=0;
function setStat(txt,bad){var el=$('#saveStat');if(!el)return;el.textContent=txt;el.classList.toggle('bad',!!bad);}
function bkKey(){return 'aman-bk-'+(ME?ME.name:'');}
function markDirty(){
  if(state.status==='exported')return;
  ver++;dirty=true;
  if(hasData())lsSet(bkKey(),JSON.stringify(state));
  setStat('غير محفوظ بعد…');
  clearTimeout(saveTimer);saveTimer=setTimeout(function(){syncSave(false);},3500);
}
function syncSave(manual){
  if(state.status==='exported')return Promise.resolve();
  if(saving)return Promise.resolve();
  if(!hasData()){if(manual)toast('لا توجد بيانات لحفظها بعد');return Promise.resolve();}
  if(!dirty&&!manual)return Promise.resolve();
  saving=true;setStat('جارٍ الحفظ…');var v0=ver;
  var req={obs:payload()};if(state.id)req.id=state.id;
  return api('saveObs',req).then(function(r){
    state.id=r.id;if(ver===v0){dirty=false;lsDel(bkKey());}
    setStat('محفوظ ✓');if(manual)toast('تم الحفظ على الخادم');
  }).catch(function(e){
    setStat('لم يُحفظ',true);
    if(manual||e.code!=='network')toast(errText(e));
    if(e.code==='locked'||e.code==='forbidden'){dirty=false;}
  }).then(function(){saving=false;if(dirty&&state.status!=='exported'){clearTimeout(saveTimer);saveTimer=setTimeout(function(){syncSave(false);},9000);}});
}
function flushNow(){
  clearTimeout(saveTimer);
  if(CUR==='obs'&&dirty&&hasData()&&!saving)return syncSave(false);
  return Promise.resolve();
}
window.addEventListener('pagehide',function(){
  if(CUR==='obs'&&dirty&&hasData()&&!saving&&CODE&&navigator.sendBeacon){
    try{var b=Object.assign({action:'saveObs',code:CODE,obs:payload()},state.id?{id:state.id}:{});navigator.sendBeacon(API,new Blob([JSON.stringify(b)],{type:'text/plain;charset=UTF-8'}));}catch(e){}
  }
});
window.addEventListener('online',function(){if(dirty)syncSave(false);});

function refresh(){
  if(!$('#rv'))return;
  var r=calc(),L=level(r.pct);
  $('#rv').textContent=r.pct==null?'—':r.pct;
  var arc=$('#arc');arc.style.strokeDasharray=C;arc.style.strokeDashoffset=C*(1-(r.pct||0)/100);
  arc.style.stroke=L?'var('+L.v+')':'var(--border)';
  var vl=$('#vl');vl.textContent=L?L.label:'لم يبدأ التقييم';vl.style.color=L?'var('+L.v+')':'var(--muted)';
  $('#vd').textContent=!L?'قيّم البنود لتظهر النتيجة والحكم':(r.n<PARTIAL_MIN?'تقييم جزئي: '+r.n+' من '+TOTAL+' بنداً فقط':L.desc);
  $('#cn').textContent=r.n;
  DOMAINS.forEach(function(d){var x=r.dom[d.id],el=$('#sg_'+d.id),l=level(x.pct);el.style.width=(x.pct||0)+'%';el.style.background=l?'var('+l.v+')':'transparent';});
  STEPS.forEach(function(s,i){
    var tab=$('#tab'+i),sm=$('small',tab),on=i===state.step;
    tab.classList.toggle('on',on);if(on)tab.setAttribute('aria-current','step');else tab.removeAttribute('aria-current');
    var txt='',done=false;
    if(DOM[s.k]){var x=r.dom[s.k];txt=x.handled+'/'+x.total;done=x.handled===x.total;}
    else if(s.k==='info'){done=!!(state.info.teacherId&&state.info.subject&&state.info.grade);txt=done?'✓':'';}
    sm.textContent=txt;tab.classList.toggle('done',done);
  });
  var cur=STEPS[state.step];
  if(DOM[cur.k]){var dx=r.dom[cur.k],dl=level(dx.pct);
    var ds=$('#dscoreVal');if(ds){ds.textContent=dx.pct==null?'—':dx.pct;ds.style.color=dl?'var('+dl.v+')':'var(--muted)';}
    var dh=$('#dHandled');if(dh)dh.textContent=dx.handled+' من '+dx.total+' بنود';}
}
function touch(){refresh();markDirty();}
function paintItem(el){

function renderDomain(d){
  var h='<div class="panel"><div class="panel-h"><div><h2>'+esc(d.title)+'</h2><div class="sub" id="dHandled"></div></div><div class="dscore"><span id="dscoreVal">—</span><small>من 100</small></div></div>'+
   '<details class="legend"><summary>معنى الدرجات</summary><ul>';
  SCALE.forEach(function(s){h+='<li><b>'+s.v+'</b> '+esc(s.l)+': '+esc(s.d)+'</li>';});
  h+='</ul></details>';
  d.items.forEach(function(it){
    h+='<div class="item" data-id="'+it.id+'"><div class="item-top"><span class="num">'+it.n+'</span><div><div class="t">'+esc(it.t)+'</div>'+(it.h?'<div class="h">'+esc(it.h)+'</div>':'')+'</div></div><div class="scale" role="group" aria-label="'+esc(it.t)+'">';
    SCALE.forEach(function(s){h+='<button type="button" class="sc'+s.v+'" data-v="'+s.v+'" aria-pressed="false"><b>'+s.v+'</b><span>'+s.l+'</span></button>';});
    h+='<button type="button" class="na" data-v="na" aria-pressed="false"><span>لم يُلاحظ</span></button></div></div>';
  });
  return h+'</div>';
}
function suggested(kind,p){var v=state.scores[p.i];return kind==='S'?(v===4):(v===1||v===2);}
function chipHTML(p,kind,pressed,sug){return '<button type="button" class="chip" data-k="'+kind+'" data-id="'+p.id+'" aria-pressed="'+(pressed?'true':'false')+'">'+esc(p.t)+(sug?'<span class="sug">مقترحة</span>':'')+'</button>';}
function groupHTML(list,kind,sel){
  var h='';
  DOMAINS.forEach(function(d){
    var arr=list.filter(function(p){return p.d===d.id;});
    arr.sort(function(a,b){return (suggested(kind,b)?1:0)-(suggested(kind,a)?1:0);});
    var sc=arr.filter(function(p){return suggested(kind,p);}).length,chosen=arr.filter(function(p){return sel.indexOf(p.id)>-1;}).length;
    h+='<details class="grp"'+((sc||chosen)?' open':'')+'><summary><span>'+esc(d.title)+'</span><span class="badge">'+(sc?sc+' مقترحة':(chosen?chosen+' محددة':'—'))+'</span></summary><div class="chips">';
    arr.forEach(function(p){h+=chipHTML(p,kind,sel.indexOf(p.id)>-1,suggested(kind,p));});
    h+='</div></details>';
  });
  return h;
}
function renderWrap(){
  var h='<div class="panel"><div class="panel-h"><div><h2>الخاتمة</h2><div class="sub">اختر العبارات الجاهزة ثم أضف ملاحظاتك</div></div></div>'+

   '<div class="toggle"><div><b>تحتاج مشاهدة متابعة</b><div class="sub" style="font-size:12.5px;color:var(--muted)">تظهر للإدارة في لوحة المتابعة</div></div><button class="switch" type="button" role="switch" id="follow" aria-checked="'+(state.follow?'true':'false')+'" aria-label="تحتاج مشاهدة متابعة"></button></div></div>';

function renderReport(){

   '<p class="pv-warn" id="expMsg" hidden></p><div class="pv-wrap" id="pvWrap"><div class="pv-inner" id="pvInner"></div></div>';

function renderStep(){
  var s=STEPS[state.step],c=$('#content'),h='';
  if(s.k==='info')h=renderInfo();else if(DOM[s.k])h=renderDomain(DOM[s.k]);else if(s.k==='wrap')h=renderWrap();else h=renderReport();
  c.innerHTML=h;$$('.item',c).forEach(paintItem);
  var locked=state.status==='exported';
  if(locked){
    if(s.k!=='report')c.insertAdjacentHTML('afterbegin','<div class="banner">مشاهدة مُصدَّرة بتاريخ '+fmtDT(state.exportedAt)+' وهي للعرض فقط.</div>');
    $$('input,select,textarea,.scale button,.chip,.switch',c).forEach(function(el){el.disabled=true;});
  }
  var sb=$('#saveBtn');if(sb)sb.disabled=locked;
  if(s.k==='report'){$('#pvInner').appendChild(buildSheet(modelFromState()));fitPreview();}
  $('#prev').disabled=state.step===0;
  var last=state.step===STEPS.length-1;$('#next').disabled=last;$('#next').style.visibility=last?'hidden':'visible';
  $('#mid').innerHTML='<b>'+(state.step+1)+' / '+STEPS.length+'</b>'+esc(s.name);

  if(act&&tabs)tabs.scrollLeft+=act.getBoundingClientRect().left+act.offsetWidth/2-(tabs.getBoundingClientRect().left+tabs.clientWidth/2);

function fitPreview(){

}
function goStep(i){state.step=Math.max(0,Math.min(STEPS.length-1,i));renderStep();if(dirty)markDirty();}

function onPick(f,v){
  var i=state.info;
  if(f==='teacherId'){i.teacherId=v;i.teacher=v?(TNAME[v]||''):'';i.subject='';i.grade='';
    if(v){var subs=subjectsFor(v,i.showAll);if(subs.length===1)i.subject=subs[0];}}
  else if(f==='subject'){i.subject=v;i.grade='';}
  else if(f==='showAll'){i.showAll=!!v;
    if(i.teacherId&&!teachersFor(i.showAll).some(function(x){return x.v===i.teacherId;})){i.teacherId='';i.teacher='';i.subject='';i.grade='';}
    else if(i.teacherId&&i.subject&&subjectsFor(i.teacherId,i.showAll).indexOf(i.subject)<0){i.subject='';i.grade='';}}
  var sy=window.scrollY;renderStep();window.scrollTo(0,sy);markDirty();
}

    strengths:d.strengths||[],dev:d.dev||[],recs:d.recs||[],notes:d.notes||'',follow:!!d.follow};

function buildSheet(m){
  var r=calcScores(m.scores),L=level(r.pct),i=m.info,hex=L?L.hex:'#9aa4bd';
  var el=document.createElement('div');el.className='sheet';
  function meta(lbl,val,cls){return '<div'+(cls?' class="'+cls+'"':'')+'><span>'+lbl+'</span><b>'+(val?esc(val):'—')+'</b></div>';}
  var h='<div class="sh-head"><img src="'+LOGO+'" alt=""><div class="sh-title"><h1>تقرير المشاهدة الصفية</h1><p>العام الدراسي '+schoolYear(i.date)+'</p></div></div>'+

var expArmed=false,expT=null;
function onExport(btn){
  var i=state.info,miss=[],msg=$('#expMsg');
  if(!i.teacherId)miss.push('المعلم(ة)');if(!i.subject)miss.push('المادة');if(!i.grade)miss.push('الشعبة');if(!i.date)miss.push('تاريخ المشاهدة');if(calc().n===0)miss.push('درجات البنود');
  if(miss.length){msg.hidden=false;msg.textContent='أكمل البيانات التالية قبل التصدير: '+miss.join('، ');return;}
  msg.hidden=true;
  if(!expArmed){expArmed=true;btn.textContent='اضغط مرة أخرى لتأكيد التصدير';clearTimeout(expT);expT=setTimeout(function(){expArmed=false;btn.textContent='تصدير وإرسال إلى النظام';},4000);return;}
  expArmed=false;clearTimeout(expT);clearTimeout(saveTimer);btn.disabled=true;btn.textContent='جارٍ التصدير…';
  var go2=function(){var req={obs:payload(),finalize:true};if(state.id)req.id=state.id;
    return api('saveObs',req).then(function(r){state.id=r.id;state.status='exported';state.exportedAt=r.updated;state.step=STEPS.length-1;state.saved=null;dirty=false;lsDel(bkKey());renderStep();toast('تم التصدير وحفظ المشاهدة على الخادم.');})
    .catch(function(e){btn.disabled=false;btn.textContent='تصدير وإرسال إلى النظام';msg.hidden=false;msg.textContent=errText(e);});};
  (saving?new Promise(function(res){setTimeout(res,1200);}):Promise.resolve()).then(go2);
}

document.addEventListener('click',function(e){
  var t=e.target;
  var pt=t.closest('[data-pt]');if(pt){go(pt.dataset.pt);return;}
  if(t.closest('#logoutBtn')){logout();return;}
  if(t.closest('#retryBtn')){CODE?loadMe():boot();return;}
  if(t.closest('#loginBtn')){var v=($('#codeIn').value||'').trim();if(!v)return;lsSet(LS_CODE,v);CODE=v;loadMe();return;}
  if(t.closest('#dashRefresh')){showDash();return;}
  var op=t.closest('[data-open]');
  if(op){var oid=op.dataset.open;
    if(CUR==='dash')openReport(oid,'رجوع إلى اللوحة',function(){renderDash();});
    else if(CUR==='my')openReport(oid,'رجوع إلى تقاريري',function(){showMy();});
    return;}
  var tab=t.closest('.tab[data-step]');if(tab){goStep(+tab.dataset.step);return;}
  if(t.closest('#saveBtn')){syncSave(true);return;}
  if(t.closest('#newBtn')){newObservation();return;}
  var fb=t.closest('.fbtn');if(fb){histFilter=fb.dataset.filter;renderHist();return;}
  var act=t.closest('[data-act]');
  if(act){
    var rec=act.closest('.rec'),rid=rec.dataset.id;
    if(act.dataset.act==='open'){
      if(CUR==='my'){openReport(rid,'رجوع إلى تقاريري',function(){showMy();});return;}
      var it=histItems.filter(function(x){return x.id===rid;})[0];
      if(it&&it.status==='exported'){openRecord(rid);return;}
      openRecord(rid);return;
    }
    if(act.dataset.act==='del'){
      if(delArmed!==rid){delArmed=rid;act.textContent='تأكيد الحذف';clearTimeout(delT);delT=setTimeout(function(){delArmed=null;if(act.isConnected)act.textContent='حذف';},3500);return;}
      delArmed=null;deleteRecord(rid);return;
    }
  }
  var sc=t.closest('.scale button');
  if(sc&&!sc.disabled){var item=sc.closest('.item'),id=item.dataset.id,v=sc.dataset.v==='na'?'na':+sc.dataset.v;
    if(state.scores[id]===v)delete state.scores[id];else state.scores[id]=v;paintItem(item);touch();return;}
  var chip=t.closest('.chip');
  if(chip&&!chip.disabled){var k=chip.dataset.k,id2=chip.dataset.id,arr=k==='S'?state.pS:k==='D'?state.pD:state.pR;
    var ix=arr.indexOf(id2);if(ix>-1)arr.splice(ix,1);else arr.push(id2);
    chip.setAttribute('aria-pressed',chip.getAttribute('aria-pressed')==='true'?'false':'true');markDirty();return;}
  if(t.closest('#autoSug')){
    S.forEach(function(p){if(suggested('S',p)&&state.pS.indexOf(p.id)<0)state.pS.push(p.id);});
    DV.forEach(function(p){if(suggested('D',p)&&state.pD.indexOf(p.id)<0)state.pD.push(p.id);});
    var sy=window.scrollY;renderStep();window.scrollTo(0,sy);markDirty();
    toast(state.pS.length+state.pD.length?'أُضيفت العبارات المقترحة من الدرجات':'لا توجد مقترحات بعد: قيّم البنود أولاً');return;}
  var fo=t.closest('#follow');
  if(fo&&!fo.disabled){state.follow=!state.follow;fo.setAttribute('aria-checked',state.follow?'true':'false');markDirty();return;}
  var eb=t.closest('#exportBtn');if(eb){onExport(eb);return;}
  if(t.closest('#printBtn')){onPrint(modelFromState());return;}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='codeIn'){var b=$('#loginBtn');if(b)b.click();}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f){state.info[t.dataset.f]=t.value;touch();return;}
  if(t.id==='notes'){state.notes=t.value;markDirty();}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f){state.info[t.dataset.f]=t.value;touch();return;}
  if(t.dataset&&t.dataset.pick){onPick(t.dataset.pick,t.type==='checkbox'?t.checked:t.value);return;}
  if(t.id==='dfCoord'){dashF.coord=t.value;$('#obsBody').innerHTML=obsRowsHTML();return;}
  if(t.id==='dfLevel'){dashF.level=t.value;$('#obsBody').innerHTML=obsRowsHTML();return;}
});
$('#prev').addEventListener('click',function(){goStep(state.step-1);});
$('#next').addEventListener('click',function(){goStep(state.step+1);});
window.addEventListener('resize',fitPreview);
boot();
})();
</script>
</body>
</html>
